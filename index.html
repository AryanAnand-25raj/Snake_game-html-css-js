<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Snake - Dark Edition</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #4caf50;
            --secondary-color: #f44336;
            --text-color: #e0e0e0;
            --accent-color: #2196f3;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevents scrolling on mobile while playing */
        }

        .game-container {
            background-color: var(--surface-color);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--primary-color);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        #game-canvas {
            background-color: #000;
            border: 2px solid #333;
            border-radius: 4px;
            display: block;
            max-width: 100%;
            height: auto;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }

        #message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.95);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid var(--primary-color);
            text-align: center;
            display: none;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #45a049;
        }

        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .mobile-controls {
                display: grid;
            }
            .controls-hint {
                display: none;
            }
        }

        .control-btn {
            background: #333;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>SNAKE</h1>
        <div class="stats">
            <div>Score: <span id="score">0</span></div>
            <div>High: <span id="high-score">0</span></div>
        </div>
        
        <canvas id="game-canvas" width="400" height="400"></canvas>

        <div class="controls-hint">
            Use Arrow Keys or WASD to Move
        </div>

        <!-- Mobile D-Pad -->
        <div class="mobile-controls">
            <div></div>
            <button class="control-btn" onclick="changeDirection({keyCode: 38})">↑</button>
            <div></div>
            <button class="control-btn" onclick="changeDirection({keyCode: 37})">←</button>
            <button class="control-btn" onclick="changeDirection({keyCode: 40})">↓</button>
            <button class="control-btn" onclick="changeDirection({keyCode: 39})">→</button>
        </div>
    </div>

    <div id="message-box">
        <h2 id="msg-title">GAME OVER</h2>
        <p id="msg-body">Your score: 0</p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const messageBox = document.getElementById('message-box');
        const msgBody = document.getElementById('msg-body');

        // Game Constants
        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;
        const INITIAL_SPEED = 100; // ms per move

        // Game State
        let snake = [];
        let food = { x: 5, y: 5 };
        let dx = 0;
        let dy = 0;
        let nextDx = 1; // Start moving right
        let nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoopTimeout;
        let isPaused = false;

        highScoreElement.innerText = highScore;

        function init() {
            // Start in the middle
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            scoreElement.innerText = score;
            createFood();
            messageBox.style.display = 'none';
            isPaused = false;
            
            if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
            main();
        }

        /**
         * Main Game Loop
         * This function calls itself repeatedly using setTimeout.
         * The delay determines the game speed.
         */
        function main() {
            if (didGameEnd()) {
                handleGameOver();
                return;
            }

            gameLoopTimeout = setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                
                // Repeat the loop
                main();
            }, INITIAL_SPEED - Math.min(score, 50)); // Gradually speed up
        }

        function clearCanvas() {
            // Subtle grid pattern or solid color
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw faint grid lines
            ctx.strokeStyle = "#111";
            for(let i = 0; i < canvas.width; i += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                // Head is a different color
                ctx.fillStyle = (index === 0) ? "#66bb6a" : "#4caf50";
                ctx.strokeStyle = "#1b5e20";
                
                ctx.fillRect(part.x * GRID_SIZE, part.y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
                ctx.strokeRect(part.x * GRID_SIZE, part.y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
            });
        }

        /**
         * Logic for moving the snake and handling eating
         */
        function advanceSnake() {
            // Update current direction with the "buffered" next direction
            // (Prevents self-collision if player taps two keys very quickly)
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Add new head to the beginning of snake array
            snake.unshift(head);

            // Check if snake ate food
            const didEatFood = snake[0].x === food.x && snake[0].y === food.y;

            if (didEatFood) {
                score += 10;
                scoreElement.innerText = score;
                createFood();
            } else {
                // Remove the last part of snake body
                snake.pop();
            }
        }

        /**
         * Collision Detection logic
         */
        function didGameEnd() {
            // Check if snake hit itself
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            // Check if snake hit walls
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x > TILE_COUNT - 1;
            const hitTopWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y > TILE_COUNT - 1;

            return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
        }

        function createFood() {
            // Generate random coordinates
            food.x = Math.floor(Math.random() * TILE_COUNT);
            food.y = Math.floor(Math.random() * TILE_COUNT);

            // Make sure food doesn't spawn on snake body
            snake.forEach(function isFoodOnSnake(part) {
                if (part.x == food.x && part.y == food.y) createFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#f44336";
            ctx.strokeStyle = "#b71c1c";
            
            // Draw food as a circle for variety
            const centerX = (food.x * GRID_SIZE) + (GRID_SIZE / 2);
            const centerY = (food.y * GRID_SIZE) + (GRID_SIZE / 2);
            const radius = (GRID_SIZE / 2) - 2;

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
        }

        function handleGameOver() {
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.innerText = highScore;
                document.getElementById('msg-title').innerText = "NEW HIGH SCORE!";
            } else {
                document.getElementById('msg-title').innerText = "GAME OVER";
            }
            
            msgBody.innerText = `Final Score: ${score}`;
            messageBox.style.display = 'block';
        }

        function resetGame() {
            init();
        }

        /**
         * Input handling
         */
        function changeDirection(event) {
            const keyPressed = event.keyCode;
            
            const LEFT_KEY = 37;
            const RIGHT_KEY = 39;
            const UP_KEY = 38;
            const DOWN_KEY = 40;
            
            const A_KEY = 65;
            const D_KEY = 68;
            const W_KEY = 87;
            const S_KEY = 83;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            // Prevent reversing direction (180 turns)
            if ((keyPressed === LEFT_KEY || keyPressed === A_KEY) && !goingRight) {
                nextDx = -1;
                nextDy = 0;
            }
            if ((keyPressed === UP_KEY || keyPressed === W_KEY) && !goingDown) {
                nextDx = 0;
                nextDy = -1;
            }
            if ((keyPressed === RIGHT_KEY || keyPressed === D_KEY) && !goingLeft) {
                nextDx = 1;
                nextDy = 0;
            }
            if ((keyPressed === DOWN_KEY || keyPressed === S_KEY) && !goingUp) {
                nextDx = 0;
                nextDy = 1;
            }
        }

        document.addEventListener("keydown", changeDirection);

        // Start the game for the first time
        window.onload = init;
    </script>
</body>
</html>
